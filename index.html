<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopCart - Simple Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="#" class="logo">ShopCart</a>
      <nav class="nav">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Shop</a>
        <a href="#" class="nav-link">About</a>
      </nav>
      <button class="cart-btn" id="cartBtn">
        <span class="cart-icon">🛒</span>
        <span class="cart-label">Cart</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Hero / Page title -->
  <section class="hero">
    <div class="container">
      <h1 class="hero-title">Shop Our Products</h1>
      <p class="hero-subtitle">Simple, clean and ready to ship. Add items to your cart and check out in seconds.</p>
    </div>
  </section>

  <!-- Products -->
  <main class="container">
    <section class="products" id="products"></section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 ShopCart. Built with HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <!-- Cart Drawer -->
  <div class="overlay" id="overlay"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-btn" id="closeCart">×</button>
    </div>

    <div class="cart-body" id="cartBody">
      <!-- Cart items injected here -->
    </div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn">Checkout</button>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
